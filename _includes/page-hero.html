<section class="page-hero">
  <div class="container">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    {% if page.hero_logo %}
    <div class="page-hero-title">
      <img src="{{ page.hero_logo | relative_url }}" alt="" width="72" height="72">
      <h1>{{ page.heading | default: page.title }}</h1>
    </div>
    {% else %}
    <h1>{{ page.heading | default: page.title }}</h1>
    {% endif %}
    {% if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
  </div>
</section>
