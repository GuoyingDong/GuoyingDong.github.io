<header class="site-header">
  <div class="container header-inner">
    <div class="brand">
      <a class="brand-logo" href="https://www.ucdenver.edu/" target="_blank" rel="noopener">
        <img src="{{ '/assets/img/cu-denver-logo.webp' | relative_url }}" alt="University of Colorado Denver" width="602" height="183">
      </a>
      <a class="brand-text" href="{{ '/' | relative_url }}">Guoying Dong <span class="brand-sub">IDM Lab · CU Denver</span></a>
    </div>
    <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Main">
      {% for item in site.nav %}
      {% if item.external %}
      <a href="{{ item.url }}" target="_blank" rel="noopener">{{ item.title }}</a>
      {% else %}
      <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endif %}
      {% endfor %}
    </nav>
  </div>
</header>
