---
layout: default
title: News
eyebrow: News
heading: Lab news
lede: Outreach, workshops and student achievements from the IDM Lab.
---
<section class="section">
  <div class="container">
    {% for n in site.data.news %}
    <article class="news-item" id="{{ n.title | slugify }}">
      <figure class="news-media">
        <img src="{{ '/assets/img/news/' | append: n.image | relative_url }}" alt="{{ n.title }}" loading="lazy">
      </figure>
      <div class="news-body prose">
        <p class="date">{{ n.date }}</p>
        <h2>{{ n.title }}</h2>
        {% for p in n.body %}<p>{{ p }}</p>{% endfor %}
      </div>
    </article>
    {% endfor %}
  </div>
</section>
