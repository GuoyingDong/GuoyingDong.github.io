<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark">IDM</span>
      <span class="brand-text">Guoying Dong <span class="brand-sub">IDM Lab · CU Denver</span></span>
    </a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Main">
      {% for item in site.nav %}
      {% if item.external %}
      <a href="{{ item.url }}" target="_blank" rel="noopener">{{ item.title }}</a>
      {% else %}
      <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endif %}
      {% endfor %}
    </nav>
  </div>
</header>
